[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openai", "python-dotenv", "pydantic>=2", "weaviate-client>=4"]

[project.optional-dependencies]
dev = ["pytest", "flake8"]

[tool.setuptools]
packages = ["rag_service"]